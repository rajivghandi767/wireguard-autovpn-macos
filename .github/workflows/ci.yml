name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: ShellCheck & Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck Static Analysis
        run: shellcheck bin/wireguard-auto install.sh uninstall.sh tests/test_wireguard_auto.sh

      - name: Execute Security & Unit Test Suite
        run: ./tests/test_wireguard_auto.sh
